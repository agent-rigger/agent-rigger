name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No dedicated toolchain action: `rust-toolchain.toml` pins the exact
      # channel ("1.97.1", not "stable") and its components; the first
      # `cargo`/`rustup` call below installs that precise chain.
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
