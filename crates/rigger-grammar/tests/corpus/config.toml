# main configuration — model profiles
server_pool = { primary = "https://api.example.internal", replicas = 2 }

[model]
name = "acme/model-large"  # locked by the team

[model.limits]
max_tokens = 4096
temperature = 0.3

[server]
url = "https://api.example.internal"

[server.meta]
region = "eu"

# security — do not loosen without review
[sandbox]
allow = [
    "read",
    "write",
    "exec",
]
deny = ["network"]
